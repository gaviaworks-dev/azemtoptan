      '<link rel="preload" href="assets/fonts/plus-jakarta-sans/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>' +
      ['assets/vendor/fontawesome/css/all.min.css', 'assets/css/tokens.css', 'assets/css/base.css', 'assets/css/components.css', 'assets/css/layout.css']
        .map(function (h) { return '<link rel="stylesheet" href="' + h + '">'; }).join(''));
    document.documentElement.classList.add('js');
  </script>
