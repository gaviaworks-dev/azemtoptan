<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Azem Toptan | Toptan Alışverişin Adresi</title>
  <meta name="description" content="Azem Toptan; gıda, içecek, temizlik, kişisel bakım ve kağıt ürünlerinde tanınan markaların toptan satışını yapar.">
  <meta name="theme-color" content="#1a114d">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="home">

<script src="assets/js/shell.js" data-shell="top"></script>

<!-- ================= İÇERİK ================= -->
<main class="page-main" id="icerik">

  <!-- Story şeridi: Bugünün Fırsatı + alt kategoriler -->
  <section class="sec sec--white sec--tight-top sec--tight-bottom" aria-label="Kısayollar">
    <div class="wrap">
      <div class="story-strip">
        <button class="icon-btn icon-btn--round rail-arrows" type="button" data-rail-prev="storyRail" aria-label="Önceki"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <div class="rail rail--bleed" id="storyRail" data-stories></div>
        <button class="icon-btn icon-btn--round rail-arrows" type="button" data-rail-next="storyRail" aria-label="Sonraki"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>

  <!-- Hero slider -->
  <section class="sec sec--white sec--flush-top sec--compact-bottom" aria-roledescription="carousel" aria-label="Kampanyalar">
    <div class="wrap">
      <div class="hero" data-hero>
        <div class="hero__frame">
          <div class="hero__track" data-hero-track></div>
        </div>
        <div class="hero__controls">
          <button class="icon-btn icon-btn--round" type="button" data-hero-prev aria-label="Önceki slayt"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
          <span class="hero__counter" data-hero-counter aria-live="polite">1/3</span>
          <button class="icon-btn icon-btn--round" type="button" data-hero-pause aria-label="Otomatik geçişi durdur"><i class="fa-solid fa-pause" aria-hidden="true"></i></button>
          <button class="icon-btn icon-btn--round" type="button" data-hero-next aria-label="Sonraki slayt"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Duyuru şeridi -->
  <div class="announce" role="region" aria-label="Duyurular">
    <div class="wrap announce__inner">
      <i class="fa-solid fa-truck-fast announce__icon" aria-hidden="true"></i>
      <div class="announce__msgs" data-announce aria-live="polite"></div>
    </div>
  </div>

  <!-- Popüler Kategoriler -->
  <section class="sec sec--strong">
    <div class="wrap">
      <div class="sec-head"><h2 class="sec-head__title">Popüler Kategoriler</h2></div>
      <div class="cat-grid reveal" data-cat-grid></div>
    </div>
  </section>

  <!-- Kampanya kartları -->
  <section class="sec sec--white" aria-label="Kampanyalar">
    <div class="wrap">
      <div class="promo-row rail--bleed" data-promos></div>
    </div>
  </section>

  <!-- Ürün rafları + vitrinler (Azem sırası) -->
  <div data-shelves></div>

  <!-- E-bülten -->
  <section class="sec sec--brand">
    <div class="wrap newsletter">
      <div>
        <h2 class="newsletter__title">İNDİRİMLERİ YAKALA</h2>
        <p class="newsletter__text">Ücretsiz olarak e-bülten aboneliğinizi başlatarak yeni kampanya ve ürünlerimizden anında haberdar olun!</p>
      </div>
      <form data-newsletter novalidate>
        <label class="field-pill">
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          <span class="sr-only">E-posta adresi</span>
          <input type="email" id="ebultenEmail" placeholder="Email Adresinizi Giriniz" required>
          <button class="btn btn--accent" type="submit">Abone Ol <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </label>
      </form>
    </div>
  </section>

  <!-- Güven şeridi -->
  <section class="sec sec--white sec--compact" aria-label="Avantajlar">
    <div class="wrap">
      <ul class="trust">
        <li class="trust__item"><span class="trust__icon"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></span><span class="trust__label">Güvenli Alışveriş</span></li>
        <li class="trust__item"><span class="trust__icon"><i class="fa-solid fa-truck-fast" aria-hidden="true"></i></span><span class="trust__label">10.000 TL Üzeri Ücretsiz Kargo</span></li>
        <li class="trust__item"><span class="trust__icon"><i class="fa-solid fa-tags" aria-hidden="true"></i></span><span class="trust__label">Günlük Mega İndirimler</span></li>
        <li class="trust__item"><span class="trust__icon"><i class="fa-solid fa-hand-holding-dollar" aria-hidden="true"></i></span><span class="trust__label">Piyasadaki En İyi Fiyatlar</span></li>
      </ul>
    </div>
  </section>
</main>

<script src="assets/js/shell.js" data-shell="bottom"></script>

<script src="assets/data/catalog.js"></script>
<script src="assets/data/products.js"></script>
<script src="assets/data/format.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
