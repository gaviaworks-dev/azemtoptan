<!-- ================= İÇERİK =================
     Azem'in kampanya malzemesi (catalog.js): ana sayfa banner'ları + kampanya kartları + Bugünün Fırsatı.
     İçeriği assets/js/campaigns.js basar. -->
<main class="page-main" id="icerik">

  <section class="sec sec--white">
    <div class="wrap">
      <div class="page-head">
        <nav aria-label="Konum"><ol class="breadcrumb"><li><a href="index.html">Ana Sayfa</a></li><li class="breadcrumb__sep" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></li><li aria-current="page">Kampanyalar</li></ol></nav>
        <div class="page-head__row"><h1 class="page-head__title">Kampanyalar</h1></div>
      </div>

      <div class="stack stack--lg">
        <!-- Bugünün Fırsatı: main.js [data-firsat] diyaloğunu açar (G10) -->
        <div class="info-grid">
          <a class="info-card" href="#" data-firsat><span class="info-card__icon"><i class="fa-solid fa-bolt" aria-hidden="true"></i></span><span><span class="info-card__label">FIRSAT</span><span class="info-card__value">Bugünün Fırsatı</span></span></a>
        </div>

        <!-- Kampanya banner'ları (ana sayfa hero'su: çerçeve oranında geniş / dikey dolgu sürümleri) -->
        <div class="hero" data-banners></div>

        <!-- Kampanya kartları (ana sayfadaki 4 kart, aynı hedefler); ≤1024 ızgara, kart ≤320 px -->
        <h2 class="sr-only">Kampanya kartları</h2>
        <div class="promo-row promo-row--grid" data-promos></div>
      </div>
    </div>
  </section>
</main>
