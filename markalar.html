<body data-page="markalar">

<!-- ================= İÇERİK =================
     Marka dizini (K11a): Azem'in /markalar sayfası boş; dizin AZEM_DB.brands'ten, yalnız satılabilir ürünü olan markalar.
     Marka → kategori.html?marka=<slug>. İçeriği assets/js/brands.js basar. -->
<main class="page-main" id="icerik">

  <section class="sec sec--white">
    <div class="wrap">
      <div class="page-head">
        <nav aria-label="Konum"><ol class="breadcrumb"><li><a href="index.html">Ana Sayfa</a></li><li class="breadcrumb__sep" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></li><li aria-current="page">Markalar</li></ol></nav>

      </div>

      <div class="stack stack--lg">
        <div class="form-grid form-grid--2">
          <div class="input-group">
            <label class="input-group__prefix" for="markaAra"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="sr-only">Marka ara</span></label>
            <input class="input" id="markaAra" type="search" placeholder="Marka ara" autocomplete="off" data-brand-filter>
          </div>
        </div>

        <!-- Harf dizini: markası olmayan harf pasif; mobilde yatay kayar -->
        <nav class="az-index" aria-label="Harf dizini" data-letters></nav>

        <p class="sr-only" role="status" data-status></p>
        <div class="stack stack--lg" data-groups></div>
      </div>
    </div>
  </section>
</main>
